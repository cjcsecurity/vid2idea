name: Collector checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: collector/uv.lock
      - name: Install locked dependencies
        run: uv sync --directory collector --extra media --locked
      - name: Install media safety test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Offline regression suite
        run: uv run --directory collector --extra media --locked pytest tests -q
      - name: Build distributions
        run: uv build --directory collector
      - name: Validate package metadata
        run: uvx --from twine==7.0.0 twine check collector/dist/*.whl collector/dist/*.tar.gz
      - name: Verify a fresh wheel installation and setup
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-env"
          uv export --directory collector --locked --no-dev --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/base-requirements.txt" --quiet
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" -r "$RUNNER_TEMP/base-requirements.txt" collector/dist/*.whl
          mkdir "$RUNNER_TEMP/onboarding"
          cd "$RUNNER_TEMP/onboarding"
          cli="$RUNNER_TEMP/wheel-env/bin/vid2idea"
          "$cli" --help
          "$cli" --version
          "$cli" init
          test "$(stat -c %a .env)" = 600
          if "$cli" init; then
            echo 'Duplicate initialization unexpectedly overwrote configuration.' >&2
            exit 1
          fi
          "$cli" status

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan source for credentials
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
